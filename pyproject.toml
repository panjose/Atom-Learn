[project]
name = "atom-learn"
version = "0.7.0"
description = "Atomic source-grounded learning with detailed expansion, research, exams, and knowledge maps"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "pypdf>=4.3",
  "python-docx>=1.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
