[project]
name = "atom-learn"
version = "0.2.0"
description = "Persistent, source-grounded, one-knowledge-atom-at-a-time learning Skill"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "pypdf>=4.3",
  "python-docx>=1.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
