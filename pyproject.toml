[project]
name = "atom-learn"
version = "0.6.0"
description = "Flexible source-grounded learning, research, exams, and knowledge-lineage mapping"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "pypdf>=4.3",
  "python-docx>=1.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
