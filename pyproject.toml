[project]
name = "atom-learn"
version = "0.14.2"
description = "Atomic source-grounded learning with closed-loop hybrid RAG, concept routing, research, exams, and knowledge maps"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "panjose" }]
keywords = [
  "ai-learning",
  "atomic-learning",
  "codex-skill",
  "education",
  "rag",
  "research",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "PyYAML>=6.0",
  "pypdf>=4.3",
  "python-docx>=1.1",
  "pdfplumber>=0.11",
  "jsonschema>=4.23",
  "platformdirs>=3.0",
]

[project.scripts]
atomlearn = "atomlearn:main"

[project.optional-dependencies]
ocr = ["pypdfium2>=4.30,<6", "pytesseract>=0.3.13", "Pillow>=10.0"]
scale = ["usearch>=2.26,<3"]
semantic = ["sentence-transformers>=5.2,<7"]
dev = ["pytest>=8.0", "hypothesis>=6.120"]

[project.urls]
Homepage = "https://github.com/panjose/Atom-Learn"
Documentation = "https://github.com/panjose/Atom-Learn#readme"
Issues = "https://github.com/panjose/Atom-Learn/issues"
Repository = "https://github.com/panjose/Atom-Learn.git"
Changelog = "https://github.com/panjose/Atom-Learn/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = {"" = "atom-learn/scripts", atomlearn_assets = "atom-learn"}
packages = ["atomlearn_assets"]
include-package-data = false
py-modules = [
  "atomlearn",
  "wizard",
  "workflow",
  "intake",
  "rag",
  "document_ir",
  "semantic",
  "vector_index",
  "adaptation",
  "evolution",
  "research",
  "exam",
  "exam_schedule",
  "lineage",
  "graph_adapter",
  "platform_state",
  "migrations",
  "user_profile",
  "effective_policy",
  "strategy",
  "strategy_analysis",
  "episode",
  "behavior_eval",
  "learning_study",
  "capsule",
  "measurement",
  "review_scheduler",
  "core_paths",
]

[tool.setuptools.package-data]
atomlearn_assets = [
  "assets/*.yaml",
  "assets/*.json",
  "assets/benchmarks/*.yaml",
  "assets/benchmarks/*.json",
  "assets/benchmarks/rag/*.yaml",
  "assets/benchmarks/rag/*.json",
  "assets/schemas/*.json",
  "assets/templates/*.yaml",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "fast: read-only unit, schema, documentation, and CLI-contract checks",
  "integration: filesystem and subprocess end-to-end workflow checks",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"
