[project]
name = "atom-learn"
version = "0.13.0"
description = "Atomic source-grounded learning with closed-loop hybrid RAG, concept routing, research, exams, and knowledge maps"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "pypdf>=4.3",
  "python-docx>=1.1",
  "pdfplumber>=0.11",
  "jsonschema>=4.23",
  "platformdirs>=3.0",
]

[project.scripts]
atomlearn = "atomlearn:main"

[project.optional-dependencies]
ocr = ["PyMuPDF>=1.24", "pytesseract>=0.3.13", "Pillow>=10.0"]
dev = ["pytest>=8.0", "hypothesis>=6.120"]

[tool.setuptools]
package-dir = {"" = "atom-learn/scripts"}
py-modules = [
  "atomlearn",
  "wizard",
  "intake",
  "rag",
  "adaptation",
  "evolution",
  "research",
  "exam",
  "lineage",
  "platform_state",
  "migrations",
  "user_profile",
  "effective_policy",
  "strategy",
  "strategy_analysis",
  "learning_study",
  "capsule",
  "measurement",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "fast: read-only unit, schema, documentation, and CLI-contract checks",
  "integration: filesystem and subprocess end-to-end workflow checks",
]
