[project]
name = "atom-learn"
version = "0.11.0"
description = "Atomic source-grounded learning with closed-loop hybrid RAG, concept routing, research, exams, and knowledge maps"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "pypdf>=4.3",
  "python-docx>=1.1",
  "pdfplumber>=0.11",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
ocr = ["PyMuPDF>=1.24", "pytesseract>=0.3.13", "Pillow>=10.0"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
