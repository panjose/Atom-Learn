[project]
name = "atom-learn"
version = "0.3.0"
description = "Persistent, source-grounded learning and research Skill with safe session adaptation"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "pypdf>=4.3",
  "python-docx>=1.1",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
