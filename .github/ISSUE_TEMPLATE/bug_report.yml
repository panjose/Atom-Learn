name: Bug report
description: Report a reproducible AtomLearn defect without private data.
title: "[Bug]: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not report vulnerabilities, credentials, release keys, private sources, learner state, or unpublished research here. Use GitHub private vulnerability reporting and read SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Core learning and mastery
        - Start and intake
        - RAG and Document IR
        - Research reading
        - Exam preparation
        - Knowledge lineage and graph view
        - Self-evolution and adaptation
        - Review scheduling and measurement
        - Release Manager and installation
        - Documentation or packaging
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and install mode
      description: Include AtomLearn version, signed Manager or source install, runtime profile, OS, and Python version.
      placeholder: "0.14.2; signed base; Windows 11; Python 3.12"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimized reproduction
      description: Use synthetic input and include the exact command or API contract.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostics
      description: Remove local paths, learner content, identifiers, secrets, tokens, and keys.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I used only synthetic or privacy-minimized material and this is not a security vulnerability.
          required: true
