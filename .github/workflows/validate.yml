name: Validate AtomLearn

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]" -e ./manager
      - name: Compile every CLI module
        run: python -m py_compile atom-learn/scripts/atomlearn.py atom-learn/scripts/core_paths.py atom-learn/scripts/wizard.py atom-learn/scripts/workflow.py atom-learn/scripts/document_ir.py atom-learn/scripts/semantic.py atom-learn/scripts/vector_index.py atom-learn/scripts/evolution.py atom-learn/scripts/research.py atom-learn/scripts/intake.py atom-learn/scripts/rag.py atom-learn/scripts/adaptation.py atom-learn/scripts/exam.py atom-learn/scripts/lineage.py atom-learn/scripts/platform_state.py atom-learn/scripts/migrations.py atom-learn/scripts/user_profile.py atom-learn/scripts/effective_policy.py atom-learn/scripts/strategy.py atom-learn/scripts/strategy_analysis.py atom-learn/scripts/learning_study.py atom-learn/scripts/capsule.py atom-learn/scripts/measurement.py atom-learn/scripts/review_scheduler.py manager/atomlearn_manager/cli.py manager/atomlearn_manager/manager.py manager/atomlearn_manager/builder.py manager/atomlearn_manager/codex.py manager/atomlearn_manager/common.py manager/atomlearn_manager/launcher.py manager/atomlearn_manager/manifest.py manager/atomlearn_manager/runtime.py manager/atomlearn_manager/statecopy.py manager/atomlearn_manager/transport.py manager/atomlearn_manager/verify.py release/artifact_contract.py release/gate.py release/open_source_gate.py
      - name: Validate public repository policy
        run: python release/open_source_gate.py --skip-history
      - name: Run fast contract tests
        run: python -m pytest -m fast
      - name: Verify installed short entry point
        run: atomlearn --help && atomlearn version && atomlearn migrate --help && atomlearn profile --help && atomlearn policy --help && atomlearn strategy --help && atomlearn study --help && atomlearn measure --help && atomlearn review --help && atomlearn evolve capsule --help && atomlearn start --help && atomlearn intake --help && atomlearn research --help && atomlearn exam --help && atomlearn-manager --help && atomlearn-release --help && atomlearn-runtime-bundle --help && atomlearn-core --help
      - name: Run full integration tests
        run: python -m pytest -m integration

  scale-rag:
    name: Ubuntu / Python 3.12 / USearch HNSW scale path
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scale adapter and tests
        run: python -m pip install -e ".[dev,scale]"
      - name: Exercise learned adapters, named gates, and HNSW generations
        run: python -m pytest tests/test_semantic_rag.py -q

  artifact-contract-upload:
    name: Release artifact contract / upload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Create representative runtime bundles
        run: python release/artifact_contract.py create artifact-contract-input
      - name: Upload Linux runtime bundle
        uses: actions/upload-artifact@v7
        with:
          name: runtime-contract-linux
          path: artifact-contract-input/runtime-contract-linux.zip
          if-no-files-found: error
          retention-days: 1
      - name: Upload Windows runtime bundle
        uses: actions/upload-artifact@v7
        with:
          name: runtime-contract-windows
          path: artifact-contract-input/runtime-contract-windows.zip
          if-no-files-found: error
          retention-days: 1

  artifact-contract-download:
    name: Release artifact contract / download and verify
    needs: artifact-contract-upload
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Download merged runtime bundles
        uses: actions/download-artifact@v8
        with:
          pattern: runtime-contract-*
          path: artifact-contract-output
          merge-multiple: true
      - name: Verify downloaded runtime bundles
        run: python release/artifact_contract.py verify artifact-contract-output
