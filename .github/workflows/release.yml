name: Release signed AtomLearn Core

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: atomlearn-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-gates:
    name: Release gates / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Core Manager and release-test dependencies
        run: python -m pip install -e ".[dev]" -e ./manager build
      - name: Validate Skill Core and default-off rollout contract
        run: python release/gate.py validate-skill
      - name: Run fast property and contract tests
        run: python -m pytest -m fast
      - name: Run complete integration fault privacy replay and compatibility tests
        run: python -m pytest -m integration
      - name: Verify installed command surfaces
        run: atomlearn --help && atomlearn version && atomlearn review --help && atomlearn-manager --help && atomlearn-core --help && atomlearn-release --help && atomlearn-runtime-bundle --help
      - name: Build complete offline runtime wheelhouse and deterministic bundle
        shell: pwsh
        run: |
          $version = python -c "import importlib.metadata as metadata; print(metadata.version('atom-learn'))"
          New-Item -ItemType Directory -Path core-wheel, runtime-wheelhouse, runtime-dist | Out-Null
          python -m build . --wheel --outdir core-wheel
          $coreWheel = Get-ChildItem core-wheel -Filter 'atom_learn-*.whl' | Select-Object -First 1
          if ($null -eq $coreWheel) { throw 'Core wheel was not built' }
          python -m pip download --only-binary=:all: --dest runtime-wheelhouse $coreWheel.FullName
          @{
            kind = 'atomlearn.runtime-profile-smoke'
            schema_version = 1
            profile = 'base'
            status = 'passed'
            suites = @('base')
            platform_verified = $true
            platform = '${{ matrix.platform }}'
            architecture = 'amd64'
            python_minor = '${{ matrix.python-version }}'
            report_id = 'release-gates-${{ github.sha }}-${{ matrix.platform }}-py${{ matrix.python-version }}'
          } | ConvertTo-Json -Compress | Set-Content -Encoding utf8 runtime-smoke.json
          atomlearn-runtime-bundle runtime-wheelhouse `
            --output-dir runtime-dist `
            --core-version $version `
            --platform '${{ matrix.platform }}' `
            --architecture amd64 `
            --python-minor '${{ matrix.python-version }}' `
            --profile base `
            --smoke-report runtime-smoke.json
      - name: Upload signed-input runtime bundle
        uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.platform }}-amd64-py${{ matrix.python-version }}
          path: runtime-dist/*.zip
          if-no-files-found: error
          retention-days: 1

  scale-rag:
    name: Stable named RAG gate / Ubuntu / Python 3.12
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the persisted HNSW scale adapter
        run: python -m pip install -e ".[dev,scale]"
      - name: Require named multilingual gate and real HNSW generations
        run: python -m pytest tests/test_semantic_rag.py -q

  publish:
    name: Build sign and publish immutable release assets
    needs: [release-gates, scale-rag]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      PYTHONUTF8: "1"
      GH_TOKEN: ${{ github.token }}
      RELEASE_PRIVATE_KEY: ${{ secrets.ATOMLEARN_RELEASE_PRIVATE_KEY }}
      RELEASE_KEY_ID: ${{ vars.ATOMLEARN_RELEASE_KEY_ID }}
      ATOMLEARN_RELEASE_GATES_PASSED: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Download the complete tested runtime matrix
        uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: runtime-dist
          merge-multiple: true
      - name: Require exact tag and configured signing identity
        shell: bash
        run: |
          test "$(git tag --points-at HEAD --list '${{ github.ref_name }}')" = "${{ github.ref_name }}"
          test -n "$RELEASE_PRIVATE_KEY"
          test -n "$RELEASE_KEY_ID"
      - name: Install isolated release tooling
        run: python -m pip install -e ./manager build
      - name: Attest completed matrix
        run: python release/gate.py write --tag "${{ github.ref_name }}" --commit-sha "${{ github.sha }}" --output "dist/gate-report.json"
      - name: Materialize ephemeral signing key
        shell: bash
        run: printf '%s' "$RELEASE_PRIVATE_KEY" > "$RUNNER_TEMP/atomlearn-release-key.txt"
      - name: Build Manager wheel then deterministic signed Core identity
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python -m build manager --wheel --outdir dist
          MANAGER_WHEEL="$(find dist -maxdepth 1 -type f -name 'atomlearn_manager-*-py3-none-any.whl' -print -quit)"
          test -n "$MANAGER_WHEEL"
          RUNTIME_ARGS=()
          while IFS= read -r bundle; do
            RUNTIME_ARGS+=(--runtime-bundle "$bundle")
          done < <(find runtime-dist -maxdepth 1 -type f -name 'atomlearn-runtime-*.zip' -print | sort)
          test "${#RUNTIME_ARGS[@]}" -eq 8
          python -m atomlearn_manager.builder . \
            --output-dir dist \
            --tag "$GITHUB_REF_NAME" \
            --commit-sha "$GITHUB_SHA" \
            --artifact-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/atomlearn-${VERSION}.zip" \
            --repository "$GITHUB_REPOSITORY" \
            --channel stable \
            --key-id "$RELEASE_KEY_ID" \
            --private-key "$RUNNER_TEMP/atomlearn-release-key.txt" \
            --trust-bundle release/atomlearn-trust-bundle.json \
            --gate-report dist/gate-report.json \
            --manager-artifact "$MANAGER_WHEEL" \
            "${RUNTIME_ARGS[@]}"
          cp release/atomlearn-trust-bundle.json dist/atomlearn-trust-bundle.json
      - name: Publish exact immutable tag assets
        shell: bash
        run: gh release create "$GITHUB_REF_NAME" dist/* runtime-dist/* --verify-tag --generate-notes --title "AtomLearn $GITHUB_REF_NAME"
