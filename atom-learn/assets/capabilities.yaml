    documentation: [README.md, README.zh-CN.md, atom-learn/SKILL.md, atom-learn/references/EXAM_PREPARATION.md]
    limitations:
      - Automatic boundaries, joint Atom mappings, and item families remain proposals until their explicit review gates pass.
      - Empirical difficulty becomes effective only from a source-located aggregate with at least 30 attempts; otherwise the product says structural complexity or official difficulty.

