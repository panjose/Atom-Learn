      - atom-learn/references/SEMANTIC_RAG.md
      - docs/V0_14_REMEDIATION_DESIGN.md
    limitations:
      - Models are user-supplied local directories; AtomLearn never silently downloads them and rejects pickle-capable weights or custom model code.
      - USearch and sentence-transformers remain developer/source optional extras and are not distributed in the signed v0.14.2 base runtime; the zero-provider deterministic path stays available for small corpora.
      - Cross-encoders are activated only from a passing, current bundled benchmark profile and can be bypassed per query.
      - The held-out release suite establishes retrieval, parsing, citation, and grounding engineering performance only. Its default hash path is an explicitly non-learned baseline, and a learned profile still needs its distributed runtime plus the unchanged release set before a stable delivery claim.

