kind: atomlearn.capability-ledger
schema_version: 1
core_version: 0.13.0
required_smoke: [core, bridge, documents, rag, exam, research]
capabilities:
  - id: learning.atomic_state_machine
    title: Single-Active-Atom learning state machine and mastery Evidence guards
    status: implemented
    default_mode: enabled
    public_claim: true
    interfaces: [activate, record-evidence, assess, status, validate]
    implementation:
      - path: atom-learn/scripts/atomlearn.py
        symbol: "def record_evidence"
      - path: atom-learn/scripts/atomlearn.py
        symbol: "def assess"
    verification:
      - path: tests/test_atomlearn_cli.py
        symbol: "test_evidence_can_be_recorded_only_for_the_active_atom"
    documentation: [README.md, README.zh-CN.md, atom-learn/SKILL.md]
    limitations:
      - Core can authenticate its deterministic scorers; external and human reviewer identity remains asserted provenance subject to the Evidence v2 registry gates.

  - id: learning.atomic_expansion_and_concept_routing
    title: Ordered child-Atom expansion and relation-aware concept routing
    status: implemented
    default_mode: enabled
    public_claim: true
    interfaces: [expand, route-concept]
    implementation:
      - path: atom-learn/scripts/atomlearn.py
        symbol: "def expand_atom"
      - path: atom-learn/scripts/atomlearn.py
        symbol: "def apply_concept_route"
    verification:
      - path: tests/test_detailed_expansion.py
        symbol: "test_detailed_request_becomes_ordered_children_then_parent_integration"
      - path: tests/test_concept_routing.py
        symbol: "test_required_prerequisite_is_inserted_then_resumes_parent"
    documentation: [README.md, README.zh-CN.md, atom-learn/SKILL.md]
    limitations:
      - The harness still proposes the semantic decomposition or relationship classification before Core validates the mutation.

  - id: rag.corrective_hybrid_v1
    title: Auditable hybrid retrieval and candidate-bound corrective Web Search loop
    status: implemented
    default_mode: enabled
    public_claim: true
    interfaces: [rag ingest, rag search, rag coverage, rag correct, rag evaluate]
    implementation:
      - path: atom-learn/scripts/rag.py
        symbol: "def search"
      - path: atom-learn/scripts/rag.py
        symbol: "def coverage"
    verification:
      - path: tests/test_rag.py
        symbol: "test_correct_command_emits_web_tasks_then_closes_the_loop"
      - path: tests/test_rag.py
        symbol: "test_rag_evaluation_reports_retrieval_and_grounding_metrics"
    documentation: [README.md, README.zh-CN.md, atom-learn/SKILL.md, atom-learn/references/RAG.md]
    limitations:
      - The default dense-like signal is a deterministic multilingual hash projection, not a learned semantic embedding.
      - Active chunks are scanned in-process; no approximate vector index is implemented in this release.

  - id: rag.provider_embedding_adapter
    title: Provider-neutral attachment of externally generated learned embeddings
    status: implemented
    default_mode: opt_in
    public_claim: true
    interfaces: [rag attach-embeddings, rag search]
    implementation:
      - path: atom-learn/scripts/rag.py
        symbol: "def attach_embeddings"
    verification:
      - path: tests/test_rag.py
        symbol: "test_provider_embeddings_join_hybrid_retrieval"
    documentation: [README.md, README.zh-CN.md, atom-learn/SKILL.md, atom-learn/references/RAG.md]
    limitations:
      - AtomLearn does not silently download a model or send source content to an embedding provider.

  - id: exam.reviewable_heuristics_v1
    title: Reviewable question splitting mapping difficulty estimation and targeted queues
    status: experimental
    default_mode: opt_in
    public_claim: true
    interfaces: [exam process, exam review-mappings, exam analyze, exam plan]
    implementation:
      - path: atom-learn/scripts/exam.py
        symbol: "def process_documents"
    verification:
      - path: tests/test_exam.py
        symbol: "test_exam_process_splits_questions_links_marking_and_proposes_reviewable_atom_mappings"
    documentation: [README.md, README.zh-CN.md, atom-learn/SKILL.md, atom-learn/references/EXAM_PREPARATION.md]
    limitations:
      - Text heuristics estimate structural complexity; empirical difficulty requires official anchors or learner performance data.
      - Source-to-exam import does not yet use a shared layout-preserving Document IR.

  - id: research.guided_corpus_v1
    title: Guided paper graph metadata reconciliation critical notes and auditable synthesis
    status: experimental
    default_mode: opt_in
    public_claim: true
    interfaces: [research import, research reconcile-metadata, research fetch-metadata, research synthesize]
    implementation:
      - path: atom-learn/scripts/research.py
        symbol: "def fetch_metadata"
      - path: atom-learn/scripts/research.py
        symbol: "def synthesize"
    verification:
      - path: tests/test_research.py
        symbol: "test_research_metadata_reconciliation_verifies_records_and_acquires_internal_citations"
      - path: tests/test_research.py
        symbol: "test_research_synthesis_surfaces_claims_contradictions_and_gaps"
    documentation: [README.md, README.zh-CN.md, atom-learn/SKILL.md, atom-learn/references/RESEARCH_READING.md]
    limitations:
      - Metadata fetching starts from known DOI records; active query discovery and citation snowballing are not yet closed-loop.
      - Cross-paper theme grouping remains primarily token-overlap based.

  - id: personalization.session_adaptation_v1
    title: Privacy-safe session and opt-in cross-course presentation adaptation
    status: implemented
    default_mode: opt_in
    public_claim: true
    interfaces: [adapt observe-session, adapt guidance, profile enable, policy effective]
    implementation:
      - path: atom-learn/scripts/adaptation.py
        symbol: "def observe_session"
      - path: atom-learn/scripts/user_profile.py
        symbol: "def observe_session"
    verification:
      - path: tests/test_adaptation.py
        symbol: "test_raw_chat_sensitive_dimensions_and_stale_revisions_are_rejected"
    documentation: [README.md, README.zh-CN.md, atom-learn/SKILL.md]
    limitations:
      - Adaptation changes presentation only and cannot weaken mastery, grounding, prerequisites, or safety.

  - id: evolution.strategy_experiments_v1
    title: Outcome-eligible uncertainty-gated teaching-strategy experiments
    status: implemented
    default_mode: opt_in
    public_claim: true
    interfaces: [strategy enable-experiments, strategy replay-shadow, strategy record-outcome, strategy monitor, strategy migrate-v2]
    implementation:
      - path: atom-learn/scripts/strategy.py
        symbol: "def record_outcome"
      - path: atom-learn/scripts/strategy_analysis.py
        symbol: "def analyze"
    verification:
      - path: tests/test_strategy.py
        symbol: "test_opt_in_shadow_replay_override_and_real_outcome_linkage"
      - path: tests/test_strategy.py
        symbol: "test_fixed_window_with_no_learning_effect_is_rejected"
    documentation: [README.md, README.zh-CN.md, atom-learn/SKILL.md, atom-learn/references/STRATEGY_EXPERIMENTS.md]
    limitations:
      - Operational within-user comparisons are not universal causal evidence and never substitute for a consented learning-effect study.

  - id: learning.learning_effect_study_v1
    title: Explicitly consented privacy-minimized local learning-effect study contract
    status: implemented
    default_mode: opt_in
    public_claim: true
    interfaces: [study enroll, study record, study status, study withdraw, study validate]
    implementation:
      - path: atom-learn/scripts/learning_study.py
        symbol: "class LearningStudyEngine"
    verification:
      - path: tests/test_learning_study.py
        symbol: "test_explicit_local_study_consent_minimization_and_withdrawal"
    documentation: [README.md, README.zh-CN.md, atom-learn/SKILL.md, atom-learn/references/LEARNING_EFFECT_STUDY.md]
    limitations:
      - The contract records local minimized observations but does not automatically aggregate, export, or establish a learning-gain claim.

  - id: release.signed_side_by_side_v1
    title: Legacy manifest v1 signed side-by-side update compatibility
    status: experimental
    default_mode: opt_in
    public_claim: true
    interfaces: [atomlearn-manager update, atomlearn-manager rollback, atomlearn-core]
    implementation:
      - path: manager/atomlearn_manager/manager.py
        symbol: "def apply_update"
      - path: manager/atomlearn_manager/builder.py
        symbol: "def build_release"
    verification:
      - path: tests/test_manager.py
        symbol: "test_signed_side_by_side_upgrade_and_paired_rollback"
    documentation: [README.md, README.zh-CN.md, atom-learn/references/RELEASE_MANAGER.md]
    limitations:
      - Legacy manifest v1 releases remain verifiable for recovery and rollback but do not declare a bridge protocol or isolated runtime.

  - id: documents.shared_ir_v1
    title: Shared layout-preserving Document IR for RAG exam and research ingestion
    status: implemented
    default_mode: enabled
    public_claim: true
    interfaces: [rag document-ir, exam process-source, research attach-source]
    implementation:
      - path: atom-learn/scripts/document_ir.py
        symbol: "def build_document_ir"
      - path: atom-learn/scripts/rag.py
        symbol: "def document_ir"
      - path: atom-learn/scripts/exam.py
        symbol: "def process_source"
      - path: atom-learn/scripts/research.py
        symbol: "def attach_source"
    verification:
      - path: tests/test_rag.py
        symbol: "test_pdf_and_docx_textbook_extractors_preserve_locators"
      - path: tests/test_exam.py
        symbol: "test_exam_process_source_consumes_shared_document_ir_and_retains_block_provenance"
      - path: tests/test_research.py
        symbol: "test_research_attach_source_binds_shared_document_ir_without_copying_full_text"
    documentation: [README.md, README.zh-CN.md, atom-learn/references/DOCUMENT_IR.md, docs/V0_14_REMEDIATION_DESIGN.md]
    limitations:
      - PDF table detection is best effort and bounding boxes remain null unless an extractor supplies trustworthy coordinates.
      - Sources indexed before Document IR remain searchable but must be reingested before exam or research IR consumers can attach them.

  - id: orchestration.typed_start_v1
    title: Revision-bound harness orchestration from one request to first Atom confirmation
    status: implemented
    default_mode: enabled
    public_claim: true
    interfaces: [start --json, start --submission, start --confirm, start --activate-first]
    implementation:
      - path: atom-learn/scripts/workflow.py
        symbol: "def make_action"
      - path: atom-learn/scripts/workflow.py
        symbol: "def validate_submission"
      - path: atom-learn/scripts/wizard.py
        symbol: "def apply_submission"
    verification:
      - path: tests/test_wizard.py
        symbol: "test_source_start_accepts_one_payload_then_resumes_with_the_plan"
      - path: tests/test_wizard.py
        symbol: "test_start_clarification_submission_reenters_evidence_discovery"
    documentation: [README.md, README.zh-CN.md, atom-learn/references/START_WIZARD.md, atom-learn/references/WORKFLOW_ACTIONS.md]
    limitations:
      - Harness-native Web Search and model reasoning remain harness responsibilities; Core validates submissions and owns state but does not embed another agent.

  - id: rag.learned_local_scale_v1
    title: Learned local multilingual embeddings HNSW and cross-encoder reranking
    status: planned
    default_mode: unavailable
    public_claim: false
    interfaces: []
    implementation: []
    verification: []
    documentation: [docs/V0_14_REMEDIATION_DESIGN.md]
    limitations:
      - This is a v0.14 implementation target, not a current capability.

  - id: mastery.calibrated_evidence_v2
    title: Typed deterministic and calibrated open-response Evidence scoring
    status: implemented
    default_mode: enabled
    public_claim: true
    interfaces:
      - atomlearn measure registry
      - atomlearn measure grade
      - atomlearn measure validate-bank
      - atomlearn measure calibrate
      - atomlearn measure validate-protocol
      - atomlearn migrate-evidence
    implementation:
      - path: atom-learn/scripts/measurement.py
        symbol: "def evidence_measurement"
      - path: atom-learn/scripts/measurement.py
        symbol: "def grade_deterministic"
      - path: atom-learn/scripts/measurement.py
        symbol: "def calibrate"
      - path: atom-learn/assets/benchmarks/calibration-open-v1.report.json
        symbol: '"qualified": true'
      - path: atom-learn/scripts/strategy.py
        symbol: "if evidence.get(\"strategy_eligible\") is not True"
    verification:
      - path: tests/test_measurement.py
        symbol: "test_free_model_scores_cannot_master_and_legacy_migration_preserves_results"
      - path: tests/test_measurement.py
        symbol: "test_open_response_calibration_report_is_reproducible_and_stratified"
      - path: tests/test_strategy.py
        symbol: "qualified for strategy use"
    documentation:
      - README.md
      - README.zh-CN.md
      - atom-learn/SKILL.md
      - atom-learn/references/MEASUREMENT.md
      - docs/V0_14_REMEDIATION_DESIGN.md
    limitations:
      - Core cannot authenticate an asserted human reviewer or external provider identity; such provenance remains an auditable harness boundary.
      - Bundled anchored-model profiles are reproducible fixtures, not blanket calibration claims for arbitrary models or prompts.

  - id: release.bridge_runtime_v2
    title: Trusted bridge Skill manifest v2 signed wheelhouse and isolated runtime
    status: implemented
    default_mode: opt_in
    public_claim: true
    interfaces:
      - atomlearn-manager init
      - atomlearn-manager trust
      - atomlearn-manager codex
      - atomlearn-manager update
      - atomlearn-core
      - atomlearn-runtime-bundle
    implementation:
      - path: manager/atomlearn_manager/codex.py
        symbol: "def resolve_core_skill"
      - path: manager/atomlearn_manager/runtime.py
        symbol: "def install_runtime"
      - path: manager/atomlearn_manager/transport.py
        symbol: "def open_release_asset"
      - path: manager/atomlearn_manager/manifest.py
        symbol: "def rotate_trust"
    verification:
      - path: tests/test_manager.py
        symbol: "test_signed_side_by_side_upgrade_and_paired_rollback"
      - path: tests/test_manager.py
        symbol: "test_every_update_persistence_stage_recovers_to_the_old_core"
      - path: tests/test_manager_contracts.py
        symbol: "test_release_manifest_network_failures_are_typed_and_never_assert"
    documentation:
      - README.md
      - README.zh-CN.md
      - atom-learn/references/RELEASE_MANAGER.md
      - docs/V0_14_REMEDIATION_DESIGN.md
    limitations:
      - The published convenience trust bundle is strongly trusted only when its fingerprint is verified through an independent channel.
      - The stable CI runtime matrix currently targets amd64 Windows and Linux; the bundle schema also models arm64 for future release gates.

  - id: review.adaptive_memory_v1
    title: Per-Atom adaptive memory state and workload-aware daily scheduling
    status: planned
    default_mode: unavailable
    public_claim: false
    interfaces: []
    implementation: []
    verification: []
    documentation: [docs/V0_14_REMEDIATION_DESIGN.md]
    limitations:
      - This is a v0.14 implementation target, not a current capability.
