kind: atomlearn.capability-ledger
schema_version: 2
core_version: 0.14.2
claim_policy:
  stable_runtime_profiles: [base]
  developer_extras: [ocr, scale, semantic]
  engineering: verified
  harness_behavior: not_evaluated
  learning_effect: not_established
  causal_learning_claims_allowed: false
required_smoke: [core, bridge, documents, rag, exam, research, review]
capabilities:
  - id: learning.atomic_state_machine
    title: Single-Active-Atom state machine with task-compatible immutable mastery Evidence
    status: implemented
    default_mode: enabled
    public_claim: true
    availability: &stable_core
      level: stable
      runtime: base
      artifact: core_runtime
      user_entrypoint: true
    interfaces: [activate, record-evidence, assess, status, validate, measure feasibility, measure task-forms]
    implementation:
      - path: atom-learn/scripts/atomlearn.py
        symbol: "def record_evidence"
      - path: atom-learn/scripts/atomlearn.py
        symbol: "def assess"
      - path: atom-learn/scripts/measurement.py
        symbol: "def mastery_feasibility"
      - path: atom-learn/scripts/measurement.py
        symbol: "def mastery_evidence_report"
    verification:
      - path: tests/test_atomlearn_cli.py
        symbol: "test_evidence_can_be_recorded_only_for_the_active_atom"
      - path: tests/test_measurement.py
        symbol: "test_persisted_v3_evidence_uses_compatible_scores_and_omits_raw_response"
      - path: tests/test_measurement.py
        symbol: "test_v2_item_rejects_choice_claiming_explanation_and_feasibility_blocks_impossible_course"
    documentation: [README.md, README.zh-CN.md, atom-learn/SKILL.md]
    limitations:
      - Core authenticates deterministic scoring and freezes scorer profiles; external and human identity remains asserted provenance, and production calibration still requires maintained domain/language validation.

  - id: learning.atomic_expansion_and_concept_routing
    title: Ordered child-Atom expansion and relation-aware concept routing
    status: implemented
    default_mode: enabled
    public_claim: true
    availability: *stable_core
    interfaces: [expand, route-concept]
    implementation:
      - path: atom-learn/scripts/atomlearn.py
        symbol: "def expand_atom"
      - path: atom-learn/scripts/atomlearn.py
        symbol: "def apply_concept_route"
    verification:
      - path: tests/test_detailed_expansion.py
        symbol: "test_detailed_request_becomes_ordered_children_then_parent_integration"
      - path: tests/test_concept_routing.py
        symbol: "test_required_prerequisite_is_inserted_then_resumes_parent"
    documentation: [README.md, README.zh-CN.md, atom-learn/SKILL.md]
    limitations:
      - The harness still proposes the semantic decomposition or relationship classification before Core validates the mutation.

  - id: rag.corrective_hybrid_v1
    title: Auditable hybrid retrieval and policy-bound corrective Web Search loop
    status: implemented
    default_mode: enabled
    public_claim: true
    availability: *stable_core
    interfaces: [rag ingest, rag search, rag coverage, rag correct, rag evaluate]
    implementation:
      - path: atom-learn/scripts/rag.py
        symbol: "def search"
      - path: atom-learn/scripts/rag.py
        symbol: "def coverage"
    verification:
      - path: tests/test_rag.py
        symbol: "test_correct_command_emits_web_tasks_then_closes_the_loop"
      - path: tests/test_rag.py
        symbol: "test_rag_evaluation_reports_retrieval_and_grounding_metrics"
      - path: tests/test_wizard.py
        symbol: "test_closed_corpus_reports_gaps_without_web_search"
    documentation: [README.md, README.zh-CN.md, atom-learn/SKILL.md, atom-learn/references/RAG.md]
    limitations:
      - The default dense-like signal is a deterministic multilingual hash projection, not a learned semantic embedding.
      - Small corpora use bounded in-process dense scoring; large corpora require a verified optional HNSW generation and never silently fall back to a full dense scan.

  - id: rag.provider_embedding_adapter
    title: Provider-neutral attachment of externally generated learned embeddings
    status: implemented
    default_mode: opt_in
    public_claim: true
    availability: *stable_core
    interfaces: [rag attach-embeddings, rag search]
    implementation:
