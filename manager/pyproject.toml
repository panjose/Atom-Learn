[project]
name = "atomlearn-manager"
version = "0.3.0"
description = "Stable signed release manager for side-by-side AtomLearn Core installations"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "panjose" }]
keywords = ["atomlearn", "release-manager", "signed-updates"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.23",
  "platformdirs>=3.0",
  "cryptography>=42.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/panjose/Atom-Learn"
Documentation = "https://github.com/panjose/Atom-Learn/blob/main/atom-learn/references/RELEASE_MANAGER.md"
Issues = "https://github.com/panjose/Atom-Learn/issues"
Repository = "https://github.com/panjose/Atom-Learn.git"

[project.scripts]
atomlearn-manager = "atomlearn_manager.cli:main"
atomlearn-release = "atomlearn_manager.builder:main"
atomlearn-core = "atomlearn_manager.launcher:main"
atomlearn-runtime-bundle = "atomlearn_manager.runtime:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
atomlearn_manager = [
  "schemas/*.json",
  "bridge/SKILL.md",
  "bridge/agents/openai.yaml",
  "bridge/scripts/resolve.py",
  "trust/atomlearn-trust-bundle.json",
]
