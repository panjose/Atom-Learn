[project]
name = "atomlearn-manager"
version = "0.1.0"
description = "Stable signed release manager for side-by-side AtomLearn Core installations"
requires-python = ">=3.10"
dependencies = [
  "PyYAML>=6.0",
  "jsonschema>=4.23",
  "platformdirs>=3.0",
  "cryptography>=42.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
atomlearn-manager = "atomlearn_manager.cli:main"
atomlearn-release = "atomlearn_manager.builder:main"
atomlearn-core = "atomlearn_manager.launcher:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
atomlearn_manager = ["schemas/*.json"]
